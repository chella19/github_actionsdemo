name: Install php
on: 
 workflow_dispatch:

jobs:
    job1-install-php:
      runs-on: ubuntu-22.04
      steps:
        - name: Update apt repo
          run: sudo apt update
        - name: Install php
          run: sudo apt install -y php
        - name: php Version
          run: php --version
    job2-install-php:
      runs-on: ubuntu-24.04
      steps:
        - name: Update apt repo
          run: |
            sudo apt update
            sudo apt install -y php
            php --version
